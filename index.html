<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Festive Pulse</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      (function () {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(4, 60, 60, 4);
        g.addColorStop(0, '#f59e0b');
        g.addColorStop(0.5, '#f43f5e');
        g.addColorStop(1, '#10b981');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.roundRect(4, 4, 56, 56, 22);
        ctx.fill();
        ctx.save();
        ctx.translate(32, 32);
        ctx.scale(1.55, 1.55);
        ctx.translate(-12, -12);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(13, 3);
        ctx.quadraticCurveTo(13.8, 11.2, 21, 12);
        ctx.quadraticCurveTo(13.8, 12.8, 13, 21);
        ctx.quadraticCurveTo(12.2, 12.8, 5, 12);
        ctx.quadraticCurveTo(12.2, 11.2, 13, 3);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(5, 3); ctx.lineTo(5, 7);
        ctx.moveTo(3, 5); ctx.lineTo(7, 5);
        ctx.moveTo(6, 17); ctx.lineTo(6, 21);
        ctx.moveTo(4, 19); ctx.lineTo(8, 19);
        ctx.stroke();
        ctx.restore();
        const link = document.createElement('link');
        link.rel = 'alternate icon';
        link.type = 'image/png';
        link.href = c.toDataURL('image/png');
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
